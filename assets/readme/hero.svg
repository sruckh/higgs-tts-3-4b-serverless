<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">higgs-tts3-runpod</title>
  <desc id="hero-desc">RunPod Serverless worker that deploys bosonai/higgs-tts-3-4b behind an OpenAI-compatible /v1/audio/speech endpoint, served by SGLang-Omni and bridged by a Python RunPod handler.</desc>

  <defs>
    <pattern id="frameRuler" width="120" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="0" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="15" y1="20" x2="15" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="30" y1="20" x2="30" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="45" y1="20" x2="45" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="60" y1="20" x2="60" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="75" y1="20" x2="75" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="90" y1="20" x2="90" y2="12" stroke="#4B545C" stroke-width="1.5"/>
      <line x1="105" y1="20" x2="105" y2="4" stroke="#38E1A6" stroke-width="2"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="440" height="320" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#0A0D10"/>

  <!-- ============ Left: identity ============ -->
  <g transform="translate(64 0)">
    <text x="0" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8A939C">RUNPOD SERVERLESS · TEXT-TO-SPEECH WORKER</text>

    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#F3F5F2">higgs-tts3-runpod</text>

    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#C3CAD0">Deploys <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38E1A6">bosonai/higgs-tts-3-4b</tspan> behind an</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#C3CAD0">OpenAI-compatible <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#F3F5F2">/v1/audio/speech</tspan> endpoint.</text>

    <!-- endpoint chip -->
    <rect x="0" y="206" width="286" height="36" rx="8" fill="#12161B" stroke="#1E252B"/>
    <circle cx="18" cy="224" r="4" fill="#38E1A6"/>
    <text x="32" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#38E1A6">POST /v1/audio/speech</text>

    <!-- frame-ruler motif -->
    <rect x="0" y="266" width="510" height="20" fill="url(#frameRuler)"/>

    <!-- metadata chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A939C">
      <rect x="0" y="322" width="118" height="32" rx="8" fill="#12161B" stroke="#1E252B"/>
      <text x="16" y="343">4B params</text>

      <rect x="130" y="322" width="132" height="32" rx="8" fill="#12161B" stroke="#1E252B"/>
      <text x="146" y="343">24kHz / 25fps</text>

      <rect x="274" y="322" width="140" height="32" rx="8" fill="#12161B" stroke="#1E252B"/>
      <text x="290" y="343">8 codebooks</text>

      <rect x="426" y="322" width="140" height="32" rx="8" fill="#12161B" stroke="#1E252B"/>
      <text x="442" y="343">&#8805;32GB VRAM</text>
    </g>
  </g>

  <!-- ============ Right: request/response system map ============ -->
  <g transform="translate(700 40)">
    <rect width="440" height="320" rx="20" fill="#12161B" stroke="#1E252B"/>

    <g clip-path="url(#panelClip)">
      <!-- Job Queue -->
      <rect x="28" y="24" width="220" height="44" rx="10" fill="#171C22" stroke="#262E36"/>
      <line x1="42" y1="38" x2="66" y2="38" stroke="#6B7680" stroke-width="2"/>
      <line x1="42" y1="46" x2="66" y2="46" stroke="#6B7680" stroke-width="2"/>
      <line x1="42" y1="54" x2="66" y2="54" stroke="#6B7680" stroke-width="2"/>
      <text x="78" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F3F5F2">RunPod Job Queue</text>

      <line x1="138" y1="68" x2="138" y2="94" stroke="#3A434B" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- handler.py -->
      <rect x="28" y="96" width="220" height="44" rx="10" fill="#171C22" stroke="#38E1A6"/>
      <text x="48" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#38E1A6">handler.py</text>

      <line x1="138" y1="140" x2="138" y2="166" stroke="#3A434B" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="150" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A939C">POST :8000</text>

      <!-- SGLang-Omni engine -->
      <rect x="28" y="168" width="384" height="60" rx="10" fill="#171C22" stroke="#262E36"/>
      <text x="48" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F3F5F2">SGLang-Omni Engine</text>
      <text x="48" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6B7680">bf16 · CUDA graphs</text>

      <line x1="220" y1="228" x2="220" y2="254" stroke="#3A434B" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- audio out -->
      <path d="M28 276 h20 l8 -16 l8 26 l8 -34 l8 40 l8 -20 l8 10 h172" fill="none" stroke="#38E1A6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="28" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A939C">wav · mp3 · opus · pcm — unary or streamed</text>
    </g>

    <defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L8 4 L0 8 z" fill="#3A434B"/>
      </marker>
    </defs>
  </g>
</svg>
